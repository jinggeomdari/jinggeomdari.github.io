# 단원 파일이 올라오면(main에 커밋되면) 통합본을 새로 만들어 GitHub Pages에 올린다.
# build.mjs가 "배포할 수 없음"을 내면 여기서 멈추고, 지금 올라가 있는 사이트가 그대로 남는다.
name: 사이트 배포

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # 단원 파일을 올린 시각으로 같은 번호 파일 중 최신 것을 고르기 위해 전체 기록이 필요
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: 통합본 만들기
        run: node build.mjs
      - name: 브라우저 검사
        run: node check.mjs
        continue-on-error: true
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
